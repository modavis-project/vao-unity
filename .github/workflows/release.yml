name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check tag and package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Identify release notes
        id: notes
        run: echo "file=.github/release-notes-${GITHUB_REF_NAME#v}.md" >> "${GITHUB_OUTPUT}"
      - name: Build verified package artifact
        run: ./Scripts/verify-release.sh
      - uses: softprops/action-gh-release@v3
        with:
          name: MODAVIS VAO Importer for Unity ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/*.tgz
            dist/*.sha256
